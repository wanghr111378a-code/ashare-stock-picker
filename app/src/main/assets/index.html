<style>

<body>

<main>
 <div class="card">

<div class="card">

<div class="notice">本版本为策略框架演示。分数仅根据手动输入的数据计算，不代表真实行情或真实交易者的私有策略。</div>
<label>股票代码</label>
<input id="code" placeholder="例如：600519">

<input id="price" type="number" step="0.01" placeholder="例如：150">

<input id="change" type="number" step="0.01" placeholder="例如：3.5">
<label>成交额（万元）</label>
<input id="amount" type="number" placeholder="例如：50000">
<label>换手率（%）</label>
<input id="turnover" type="number" step="0.01" placeholder="例如：5">
<button class="primary" onclick="addStock()">计算评分并加入当前策略</button>
</div>
<div class="card">
<h3>当前策略选股榜</h3>

</div>

<h3>策略说明</h3>

<script>
const strategies=[
{name:"北京炒家策略",info:"偏向短线强势、题材热度、成交活跃及涨停次日表现的研究框架。"},
{name:"退学炒股策略",info:"偏向市场情绪、热点切换、龙头辨识及风险控制的研究框架。"},
{name:"炒股养家策略",info:"偏向市场合力、情绪周期、主线题材及盈亏比的研究框架。"}
];
let current=0;
let books=[[],[],[]];
function load(){try{books=JSON.parse(localStorage.getItem("ashare_books"))||[[],[],[]]}catch(e){books=[[],[],[]]}}
function save(){localStorage.setItem("ashare_books",JSON.stringify(books))}
function switchTab(i){current=i;document.querySelectorAll(".tabs button").forEach((b,j)=>b.classList.toggle("active",i===j));document.getElementById("strategyTitle").textContent=strategies[i].name;document.getElementById("strategyInfo").textContent=strategies[i].info;render()}
async function scanMarket(){
  const status=document.getElementById("scanStatus");
  status.textContent="正在连接行情服务器，请稍候……";
  try{
    const url="https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=100&po=1&np=1&fltt=2&invt=2&fid=f3&fs=m:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23&fields=f2,f3,f5,f6,f8,f12,f14,f15,f16,f17,f18";
    const response=await fetch(url);
    if(!response.ok) throw new Error("行情服务器响应异常");
    const result=await response.json();
   async function fetchWithRetry(url, retries=3){
  for(let attempt=1;attempt<=retries;attempt++){
    try{
      const response=await fetch(url,{
        method:"GET",
        cache:"no-store"
      });

      if(!response.ok){
        throw new Error("HTTP "+response.status);
      }

      return await response.json();

    }catch(error){
      if(attempt===retries){
        throw error;
      }

      await new Promise(resolve=>
        setTimeout(resolve,attempt*1000)
      );
    }
  }
}
    const url="https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=5000&po=1&np=1&fltt=2&invt=2&fid=f3&fs=m:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23&fields=f2,f3,f5,f6,f8,f12,f14,f15,f16,f17,f18";

const response=await fetch(url);

if(!response.ok){
  throw new Error("行情服务器响应异常");
}

const result=await response.json();
const rows=result?.data?.diff;

if(!Array.isArray(rows)||rows.length===0){
  throw new Error("没有取得股票数据");
}
if(!Array.isArray(rows)||rows.length===0){
  throw new Error("没有取得股票数据");
}
    if(!Array.isArray(rows)||rows.length===0) throw new Error("没有取得股票数据");
    const stocks=rows.map(x=>({
      code:String(x.f12||""),
      name:String(x.f14||""),
      price:Number(x.f2),
      change:Number(x.f3),
      amount:Number(x.f6)/10000,
      turnover:Number(x.f8),
      high:Number(x.f15),
      low:Number(x.f16)
    })).filter(s=>
      s.code&&
      s.name&&
      !/^(ST|\*ST|退)/i.test(s.name)&&
      Number.isFinite(s.price)&&
      s.price>=5&&
      s.price<=300&&
      Number.isFinite(s.change)&&
      Number.isFinite(s.amount)&&
      s.amount>0&&
      Number.isFinite(s.turnover)&&
      s.turnover>=0&&
      Number.isFinite(s.high)&&
      Number.isFinite(s.low)&&
      s.high>=s.price&&
      s.low<=s.price&&
      s.low>0
    );
    if(!stocks.length) throw new Error("没有可用的股票数据");
        const getRiskStatus=s=>{
      if(!Number.isFinite(s.price)||s.price<=0||
         !Number.isFinite(s.change)||
         !Number.isFinite(s.high)||
         !Number.isFinite(s.low)){
        return "行情异常";
      }
      const code=String(s.code);
      const isBJ=/^(4|8|92)/.test(code);
      const isGrowth=/^30/.test(code);
      const isSTAR=/^68/.test(code);
      const limit=isBJ?30:(isGrowth||isSTAR?20:10);
      if(s.change>=limit-1) return "接近涨停";
      if(s.change<=-limit+1) return "接近跌停";
      return "正常";
    };
   const scoreBeijing=s=>
      (s.change>=2&&s.change<=8?30:0)+
      (s.amount>=50000?30:s.amount>=20000?20:0)+
      (s.turnover>=3&&s.turnover<=15?25:0)+
      (s.price>=s.high*0.97?15:0);
    const scoreTuixue=s=>
      (s.change>=3&&s.change<=9?35:0)+
      (s.amount>=30000?25:s.amount>=10000?15:0)+
      (s.turnover>=5&&s.turnover<=20?25:0)+
      (s.change>0?15:0);
    const scoreYangjia=s=>
      (s.change>=1&&s.change<=7?25:0)+
      (s.amount>=50000?30:s.amount>=20000?20:0)+
      (s.turnover>=2&&s.turnover<=12?25:0)+
      (s.price>=s.low*1.03?20:0);
    const configs=[
      {name:"北京炒家策略",score:scoreBeijing},
      {name:"退学炒股策略",score:scoreTuixue},
      {name:"炒股养家策略",score:scoreYangjia}
    ];
        configs.forEach((cfg,i)=>{
      books[i]=stocks.map(s=>({
        ...s,
        score:cfg.score(s),
        risk:getRiskStatus(s)
      }))
      .filter(s=>s.score>=40)
      .sort((a,b)=>b.score-a.score)
      .slice(0,20);
    });

    const codes=[...new Set(
      books.flat().map(s=>s.code)
    )];

    const trendCache={};
    let nextIndex=0;

    async function trendWorker(){
      while(nextIndex<codes.length){
        const code=codes[nextIndex++];
        trendCache[code]=await getDailyTrend(code);
      }
    }

    await Promise.all(
      Array.from(
        {length:Math.min(5,codes.length)},
        ()=>trendWorker()
      )
    );

    books.forEach((list,i)=>{
      list.forEach(s=>{
        const t=trendCache[s.code];
        s.trendData=t;

        if(!t) return;

        const trendBonus=[
          t.trend==="多头排列"?10:
          t.trend==="空头排列"?-10:0,

          t.trend==="多头排列"?12:
          t.trend==="空头排列"?-12:0,

          t.trend==="多头排列"?8:
          t.trend==="空头排列"?-8:0
        ][i];

        const volumeBonus=
          t.volumeRatio!==null&&t.volumeRatio>=1.5?5:0;

        s.score=Math.max(
          0,
          Math.min(100,s.score+trendBonus+volumeBonus)
        );
      });

      list.sort((a,b)=>b.score-a.score);
    });
    save();
    switchTab(current);
    status.textContent="扫描成功："+stocks.length+"只股票；每个策略显示前20名。数据来源：东方财富公开行情，可能存在延迟。获取时间："+new Date().toLocaleString();
  }catch(error){
    status.textContent="行情获取失败："+error.message+"。未使用模拟数据，请稍后重试。";
  }
}
 async function getDailyTrend(code){
  try{
    const market=/^(6)/.test(code)?1:0;
    const url="https://push2his.eastmoney.com/api/qt/stock/kline/get"+
      "?secid="+market+"."+encodeURIComponent(code)+
      "&fields1=f1,f2,f3,f4,f5,f6"+
      "&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61"+
      "&klt=101&fqt=1&beg=0&end=20500101&lmt=30";

    const response=await fetch(url);
    if(!response.ok) throw new Error("K线请求失败");

    const result=await response.json();
    const rows=result?.data?.klines;

    if(!Array.isArray(rows)||rows.length<20) return null;

    const bars=rows.map(x=>{
      const a=x.split(",");
      return {
        date:a[0],
        close:Number(a[2]),
        volume:Number(a[5])
      };
    }).filter(x=>
      Number.isFinite(x.close)&&x.close>0&&
      Number.isFinite(x.volume)&&x.volume>=0
    );

    if(bars.length<20) return null;

    const avg=n=>{
      const arr=bars.slice(-n).map(x=>x.close);
      return arr.reduce((a,b)=>a+b,0)/arr.length;
    };

    const ma5=avg(5);
    const ma10=avg(10);
    const ma20=avg(20);
    const avgVol5=bars.slice(-6,-1)
      .reduce((a,b)=>a+b.volume,0)/5;
    const volumeRatio=avgVol5>0?
      bars[bars.length-1].volume/avgVol5:null;

    return {
      ma5,ma10,ma20,
      volumeRatio,
      trend:ma5>ma10&&ma10>ma20?
        "多头排列":
        ma5<ma10&&ma10<ma20?
        "空头排列":"均线交错",
      klineDate:bars[bars.length-1].date
    };
  }catch(error){
    return null;
  }
}
function addStock(){
let code=document.getElementById("code").value.trim(),name=document.getElementById("name").value.trim();
let price=Number(document.getElementById("price").value),change=Number(document.getElementById("change").value),amount=Number(document.getElementById("amount").value),turnover=Number(document.getElementById("turnover").value);
if(!code||!name||price<=0||![change,amount,turnover].every(Number.isFinite)){alert("请完整填写有效数据");return}
let score=0;
if(change>0&&change<8)score+=25;
if(amount>=10000)score+=25;
if(turnover>=3&&turnover<=15)score+=25;
if(change>=3)score+=25;
books[current]=books[current].filter(x=>x.code!==code);
books[current].push({code,name,price,change,amount,turnover,score,time:new Date().toLocaleString()});
books[current].sort((a,b)=>b.score-a.score);save();render();
["code","name","price","change","amount","turnover"].forEach(id=>document.getElementById(id).value="");
}
function getTradePlan(s){
const p=Number(s.price)||0;
const days=[[1,3],[2,5],[3,7]][current];
return {
buyLow:p*0.99,
buyHigh:p*1.005,
stop:p*0.97,
target1:p*1.05,
target2:p*1.08,
days:days[0]+"-"+days[1]
};
}

function render(){
let el=document.getElementById("list"),data=books[current];
if(!data.length){el.className="empty";el.textContent="暂无股票，请先扫描或录入数据";return}
el.className="";
el.innerHTML=data.map((s,i)=>{
const p=getTradePlan(s);
const fmt=v=>Number(v).toFixed(2);
return `<div class="stock">
<strong>${i+1}. ${safe(s.name)} (${safe(s.code)})</strong><span class="score">${s.score}分</span>
<span class="risk">风险：${safe(s.risk||"未评估")}</span>
<p>现价：${fmt(s.price)}元　涨幅：${Number(s.change).toFixed(2)}%</p>
<small>成交额：${Number(s.amount).toFixed(0)}万元　换手率：${Number(s.turnover).toFixed(2)}%</small>
${s.trendData?`
<p><strong>历史行情分析</strong></p>
<small>
均线趋势：${safe(s.trendData.trend)}<br>
MA5：${s.trendData.ma5.toFixed(2)}　
MA10：${s.trendData.ma10.toFixed(2)}　
MA20：${s.trendData.ma20.toFixed(2)}<br>
5日量比：${s.trendData.volumeRatio===null?"暂无":s.trendData.volumeRatio.toFixed(2)}
<br>日K线日期：${safe(s.trendData.klineDate)}
</small>
`:`
<p><strong>历史行情分析</strong></p>
<small>历史K线暂不可用，未生成趋势信号</small>
`}
<p><strong>V1.2模型参考（元）</strong></p>
<small>参考观察区间：${fmt(p.buyLow)}–${fmt(p.buyHigh)}<br>
风险观察线：${fmt(p.stop)}<br>
目标观察位：${fmt(p.target1)} / ${fmt(p.target2)}<br>
模型持有周期：${p.days}个交易日</small><br>
<button class="secondary" onclick="removeStock('${encodeURIComponent(s.code)}')">删除</button>
</div>`;
}).join("");
}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function removeStock(code){code=decodeURIComponent(code);books[current]=books[current].filter(s=>s.code!==code);save();render()}
load();switchTab(0);
</script>
