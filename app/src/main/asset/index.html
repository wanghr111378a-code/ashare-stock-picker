<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>A股智能选股器</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;color:#18202b;font-family:Arial,"Microsoft YaHei",sans-serif}
header{background:#172b4d;color:white;padding:20px 16px}
header h2{margin:0 0 7px;font-size:21px}
header p{margin:0;font-size:12px;color:#cbd5e1}
.tabs{display:flex;background:white;position:sticky;top:0;z-index:2;box-shadow:0 2px 5px #ddd}
.tabs button{flex:1;border:0;background:white;padding:15px 3px;font-size:13px;color:#555}
.tabs button.active{color:#1769aa;border-bottom:3px solid #1769aa;font-weight:bold}
main{padding:14px}
.card{background:white;border-radius:12px;padding:15px;margin-bottom:13px;box-shadow:0 2px 8px #0000000a}
h3{font-size:16px;margin:0 0 12px}
label{display:block;font-size:13px;color:#657080;margin:9px 0 5px}
input{width:100%;padding:12px;border:1px solid #d9dee7;border-radius:8px;font-size:15px}
.primary{background:#1769aa;color:white;border:0;border-radius:8px;padding:12px;width:100%;font-size:15px;margin-top:12px}
.secondary{background:#eef3f8;color:#1769aa;border:0;border-radius:8px;padding:9px 12px}
.stock{border-top:1px solid #edf0f3;padding:12px 0}
.stock strong{font-size:15px}
.score{float:right;color:#1769aa;font-weight:bold}
small{color:#7b8490}
.notice{font-size:12px;color:#8b5b12;line-height:1.6}
.empty{text-align:center;color:#999;padding:25px 5px;font-size:13px}
</style>
</head>
<body>
<header>
<h2>📈 A股智能选股器</h2>
<p>三个独立策略 · 手机本地运行 · 行情需核实</p>
</header>
<div class="tabs">
<button class="active" onclick="switchTab(0)">北京炒家</button>
<button onclick="switchTab(1)">退学炒股</button>
<button onclick="switchTab(2)">炒股养家</button>
</div>
<main>
<div class="card">
<h3 id="strategyTitle">北京炒家策略</h3>
<div class="notice">本版本为策略框架演示。分数仅根据手动输入的数据计算，不代表真实行情或真实交易者的私有策略。</div>
<label>股票代码</label>
<input id="code" placeholder="例如：600519">
<label>股票名称</label>
<input id="name" placeholder="例如：贵州茅台">
<label>当前价格（元）</label>
<input id="price" type="number" step="0.01" placeholder="例如：150">
<label>今日涨幅（%）</label>
<input id="change" type="number" step="0.01" placeholder="例如：3.5">
<label>成交额（万元）</label>
<input id="amount" type="number" placeholder="例如：50000">
<label>换手率（%）</label>
<input id="turnover" type="number" step="0.01" placeholder="例如：5">
<button class="primary" onclick="addStock()">计算评分并加入当前策略</button>
</div>
<div class="card">
<h3>当前策略选股榜</h3>
<div id="list" class="empty">暂无股票，请先录入数据</div>
</div>
<div class="card">
<h3>策略说明</h3>
<div id="strategyInfo" class="notice"></div>
</div>
</main>
<script>
const strategies=[
{name:"北京炒家策略",info:"偏向短线强势、题材热度、成交活跃及涨停次日表现的研究框架。"},
{name:"退学炒股策略",info:"偏向市场情绪、热点切换、龙头辨识及风险控制的研究框架。"},
{name:"炒股养家策略",info:"偏向市场合力、情绪周期、主线题材及盈亏比的研究框架。"}
];
let current=0;
let books=[[],[],[]];
function load(){try{books=JSON.parse(localStorage.getItem("ashare_books"))||[[],[],[]]}catch(e){books=[[],[],[]]}}
function save(){localStorage.setItem("ashare_books",JSON.stringify(books))}
function switchTab(i){current=i;document.querySelectorAll(".tabs button").forEach((b,j)=>b.classList.toggle("active",i===j));document.getElementById("strategyTitle").textContent=strategies[i].name;document.getElementById("strategyInfo").textContent=strategies[i].info;render()}
function addStock(){
let code=document.getElementById("code").value.trim(),name=document.getElementById("name").value.trim();
let price=Number(document.getElementById("price").value),change=Number(document.getElementById("change").value),amount=Number(document.getElementById("amount").value),turnover=Number(document.getElementById("turnover").value);
if(!code||!name||price<=0||![change,amount,turnover].every(Number.isFinite)){alert("请完整填写有效数据");return}
let score=0;
if(change>0&&change<8)score+=25;
if(amount>=10000)score+=25;
if(turnover>=3&&turnover<=15)score+=25;
if(change>=3)score+=25;
books[current]=books[current].filter(x=>x.code!==code);
books[current].push({code,name,price,change,amount,turnover,score,time:new Date().toLocaleString()});
books[current].sort((a,b)=>b.score-a.score);save();render();
["code","name","price","change","amount","turnover"].forEach(id=>document.getElementById(id).value="");
}
function render(){
let el=document.getElementById("list"),data=books[current];
if(!data.length){el.className="empty";el.textContent="暂无股票，请先录入数据";return}
el.className="";
el.innerHTML=data.map((s,i)=>`<div class="stock"><strong>${i+1}. ${safe(s.name)} (${safe(s.code)})</strong><span class="score">${s.score}分</span><p>价格：${s.price}元　涨幅：${s.change}%</p><small>成交额：${s.amount}万元　换手率：${s.turnover}%</small><br><button class="secondary" onclick="removeStock('${encodeURIComponent(s.code)}')">删除</button></div>`).join("");
}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function removeStock(code){code=decodeURIComponent(code);books[current]=books[current].filter(s=>s.code!==code);save();render()}
load();switchTab(0);
</script>
</body>
</html>
